<title>訪問予定表メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #eef1f4;
    --panel: #ffffff;
    --panel-line: #d6dce3;
    --ink: #1f2a33;
    --ink-soft: #5b6873;
    --accent: #1c7c74;
    --accent-ink: #ffffff;
    --accent-soft: #e2f1ef;
    --field: #f7f9fa;
    --field-line: #c9d1d8;
    --danger: #c8322b;
    --focus: #2b5fb3;
    /* 用紙は印刷物なので常に白・黒インク */
    --paper: #ffffff;
    --paper-ink: #1f2a33;
    --paper-line: #b9c2ca;
    --paper-line-soft: #e3e8ec;
    --sun: #c8322b;
    --sat: #2b5fb3;
    --holiday-bg: #fdf1f0;
    --visit-bg: #e2f1ef;
    --visit-line: #1c7c74;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #171c21;
      --panel: #202830;
      --panel-line: #33404a;
      --ink: #e6ebef;
      --ink-soft: #9aa8b3;
      --accent: #4fb8ae;
      --accent-ink: #0f1a19;
      --accent-soft: #1f3d3a;
      --field: #1a2129;
      --field-line: #40505c;
      --danger: #ef6b64;
      --focus: #7fa6e8;
    }
  }
  :root[data-theme="dark"] {
    --ground: #171c21;
    --panel: #202830;
    --panel-line: #33404a;
    --ink: #e6ebef;
    --ink-soft: #9aa8b3;
    --accent: #4fb8ae;
    --accent-ink: #0f1a19;
    --accent-soft: #1f3d3a;
    --field: #1a2129;
    --field-line: #40505c;
    --danger: #ef6b64;
    --focus: #7fa6e8;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  .topbar { max-width: 1400px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .topbar h1 { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em; }
  .topbar p { margin: 0; color: var(--ink-soft); }

  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 18px; display: grid; gap: 18px; }
  .section { display: grid; gap: 10px; }
  .section h2 { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 7px 9px; min-width: 0;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .row, .row3 { grid-template-columns: 1fr; } }

  .weekdays { display: flex; gap: 4px; }
  .weekdays label {
    flex: 1; text-align: center; border: 1px solid var(--field-line); border-radius: 6px; padding: 6px 0; cursor: pointer; user-select: none; background: var(--field); font-weight: 500;
  }
  .weekdays input { position: absolute; opacity: 0; width: 0; height: 0; }
  .weekdays label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .weekdays label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .weekdays label.sun { color: var(--sun); }
  .weekdays label.sat { color: var(--sat); }
  .weekdays label:has(input:checked).sun, .weekdays label:has(input:checked).sat { color: var(--accent-ink); }

  .btn { border: 1px solid var(--field-line); background: var(--field); border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.quiet { background: transparent; }
  .btn.danger { color: var(--danger); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .visits { display: grid; gap: 6px; }
  .visit {
    display: grid; grid-template-columns: 1.15fr .8fr .8fr 1.4fr auto; gap: 6px; align-items: center;
  }
  .visit input { background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 5px 6px; min-width: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  .visit .del { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; border-radius: 6px; line-height: 1; }
  .visit .del:hover { color: var(--danger); background: var(--field); }
  .visits-empty { color: var(--ink-soft); font-size: 13px; }
  .count { color: var(--ink-soft); font-size: 12px; }
  .hint { color: var(--ink-soft); font-size: 12px; margin: 0; }
  .sample-tag { display: inline-block; font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; font-weight: 700; vertical-align: middle; }

  /* ---------- プレビュー ---------- */
  .preview { display: grid; gap: 12px; min-width: 0; }
  .preview-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .preview-bar .spacer { flex: 1; }
  .sheet-frame { overflow: hidden; }
  .sheet-scale { transform-origin: top left; }

  .sheet {
    width: 297mm; height: 210mm; padding: 10mm 11mm;
    background: var(--paper); color: var(--paper-ink);
    box-shadow: 0 2px 14px rgba(20, 30, 40, .14);
    display: grid; grid-template-rows: auto auto 1fr auto; gap: 3mm;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .sheet-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8mm; border-bottom: .6mm solid var(--paper-ink); padding-bottom: 2.5mm; }
  .sheet-title { display: flex; align-items: baseline; gap: 5mm; flex-wrap: wrap; }
  .sheet-title .ym { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 900; font-size: 30pt; letter-spacing: .02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .sheet-title .ym small { font-size: 14pt; font-weight: 700; margin-left: 1mm; }
  .sheet-title .kind { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 700; font-size: 16pt; }
  .sheet-client { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 700; font-size: 20pt; line-height: 1.2; }
  .sheet-client .sama { font-size: 12pt; margin-left: 2mm; }
  .sheet-office { text-align: right; font-size: 9.5pt; line-height: 1.5; color: var(--paper-ink); }
  .sheet-office strong { font-size: 11pt; }

  .dow { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow div { text-align: center; font-weight: 700; font-size: 10.5pt; padding: 1mm 0; border-top: .3mm solid var(--paper-ink); border-bottom: .3mm solid var(--paper-ink); }
  .dow .sun { color: var(--sun); }
  .dow .sat { color: var(--sat); }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); min-height: 0; border-left: .3mm solid var(--paper-line); border-top: 0; }
  .cell { border-right: .3mm solid var(--paper-line); border-bottom: .3mm solid var(--paper-line); padding: 1.2mm 1.5mm; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .8mm; }
  .cell.out { background: repeating-linear-gradient(135deg, transparent 0 3mm, var(--paper-line-soft) 3mm 3.4mm); }
  .cell.holiday { background: var(--holiday-bg); }
  .cell.today { box-shadow: inset 0 0 0 .5mm var(--visit-line); }
  .daynum { display: flex; align-items: baseline; gap: 1.5mm; line-height: 1; }
  .daynum b { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 700; font-size: 13pt; font-variant-numeric: tabular-nums; }
  .daynum .hname { font-size: 7.5pt; color: var(--sun); font-weight: 500; }
  .cell.sun .daynum b, .cell.holiday .daynum b { color: var(--sun); }
  .cell.sat .daynum b { color: var(--sat); }
  .entry {
    background: var(--visit-bg); border-left: .9mm solid var(--visit-line); border-radius: 0 1mm 1mm 0;
    padding: .6mm 1.2mm; font-size: 8.5pt; line-height: 1.3; display: grid;
  }
  .entry .time { font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .entry .label { font-size: 8pt; overflow-wrap: anywhere; }
  .entry.compact { grid-template-columns: auto 1fr; gap: 0 1.5mm; align-items: baseline; }

  .sheet-foot { display: flex; justify-content: space-between; gap: 6mm; font-size: 8.5pt; line-height: 1.5; border-top: .3mm solid var(--paper-line); padding-top: 1.5mm; }
  .sheet-foot .note { flex: 1; white-space: pre-wrap; }
  .sheet-foot .legend { white-space: nowrap; color: var(--paper-ink); }
  .sheet-foot .legend i { display: inline-block; width: 3mm; height: 2.5mm; background: var(--visit-bg); border-left: .6mm solid var(--visit-line); vertical-align: -0.3mm; margin-right: 1mm; }

  /* ---------- 画像モーダル ---------- */
  .modal[hidden] { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(10, 16, 20, .7); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal-box { background: var(--panel); color: var(--ink); border-radius: 10px; padding: 16px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; }
  .modal-box img { max-width: 100%; height: auto; border: 1px solid var(--panel-line); }
  .modal-box p { margin: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: border-color .15s, background .15s; }
  }

  /* ---------- 印刷 ---------- */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .topbar, .panel, .preview-bar, .modal { display: none !important; }
    .app { display: block; max-width: none; }
    .sheet-frame { overflow: visible; }
    .sheet-scale { transform: none !important; }
    .sheet { box-shadow: none; width: 297mm; height: 210mm; }
    .cell.today { box-shadow: none; }
  }
</style>

<div class="topbar">
  <h1>訪問予定表メーカー</h1>
  <p>利用者さんにお渡しする月間の訪問予定表を作って、印刷・PDF・画像（Canva 用）に出せます。</p>
</div>

<div class="app">
  <aside class="panel" aria-label="設定">
    <div class="section">
      <h2>基本情報</h2>
      <div class="field"><label for="client">利用者名</label><input id="client" placeholder="例：山田 花子"></div>
      <div class="row">
        <div class="field"><label for="ym">年月</label><input id="ym" type="month"></div>
        <div class="field"><label for="kind">表の名前</label><input id="kind" placeholder="訪問予定表"></div>
      </div>
      <div class="field"><label for="office">事業所名</label><input id="office" placeholder="例：訪問看護ステーションさくら"></div>
      <div class="row">
        <div class="field"><label for="phone">連絡先</label><input id="phone" placeholder="例：03-1234-5678"></div>
        <div class="field"><label for="staff">担当者</label><input id="staff" placeholder="例：佐藤"></div>
      </div>
      <div class="field"><label for="note">下の備考</label><textarea id="note" placeholder="ご都合が悪くなった場合は、前日までにご連絡ください。"></textarea></div>
    </div>

    <div class="section">
      <h2>定期の訪問をまとめて追加</h2>
      <div class="weekdays" id="weekdays" role="group" aria-label="曜日">
        <label class="sun"><input type="checkbox" value="0">日</label>
        <label><input type="checkbox" value="1">月</label>
        <label><input type="checkbox" value="2">火</label>
        <label><input type="checkbox" value="3">水</label>
        <label><input type="checkbox" value="4">木</label>
        <label><input type="checkbox" value="5">金</label>
        <label class="sat"><input type="checkbox" value="6">土</label>
      </div>
      <div class="row3">
        <div class="field"><label for="r-label">内容</label><input id="r-label" placeholder="訪問看護"></div>
        <div class="field"><label for="r-start">開始</label><input id="r-start" type="time" value="10:00"></div>
        <div class="field"><label for="r-end">終了</label><input id="r-end" type="time" value="11:00"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="add-recurring" type="button">この月の該当曜日に追加</button>
      </div>
      <p class="hint">祝日にも追加されます。お休みの日は下の一覧から消してください。</p>
    </div>

    <div class="section">
      <h2>1回だけの訪問を追加</h2>
      <div class="row3">
        <div class="field"><label for="s-date">日付</label><input id="s-date" type="date"></div>
        <div class="field"><label for="s-start">開始</label><input id="s-start" type="time" value="14:00"></div>
        <div class="field"><label for="s-end">終了</label><input id="s-end" type="time" value="15:00"></div>
      </div>
      <div class="row">
        <div class="field"><label for="s-label">内容</label><input id="s-label" placeholder="リハビリ"></div>
        <div class="field" style="align-self:end"><button class="btn" id="add-single" type="button">追加</button></div>
      </div>
    </div>

    <div class="section">
      <h2>この月の訪問一覧 <span class="count" id="count"></span></h2>
      <div class="visits" id="visits"></div>
      <div class="actions">
        <button class="btn quiet danger" id="clear-month" type="button">この月をすべて消す</button>
      </div>
      <p class="hint">入力内容はこのブラウザに自動保存されます。</p>
    </div>
  </aside>

  <section class="preview" aria-label="プレビュー">
    <div class="preview-bar">
      <button class="btn primary" id="print" type="button">印刷 / PDF に保存</button>
      <button class="btn" id="export" type="button">画像にする（Canva 用）</button>
      <span class="spacer"></span>
      <span class="hint" id="sample-hint"></span>
    </div>
    <div class="sheet-frame" id="frame">
      <div class="sheet-scale" id="scale">
        <div class="sheet" id="sheet"></div>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <p><strong>画像ができました。</strong>画像を右クリック（スマホは長押し）して「画像を保存」してから、Canva の「アップロード」に入れてください。</p>
    <img id="modal-img" alt="訪問予定表の画像">
    <div class="actions"><button class="btn" id="modal-close" type="button">閉じる</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  'use strict';

  // 日本の祝日（内閣府の公表分）
  const HOLIDAYS = {
    '2026-01-01': '元日', '2026-01-12': '成人の日', '2026-02-11': '建国記念の日', '2026-02-23': '天皇誕生日',
    '2026-03-20': '春分の日', '2026-04-29': '昭和の日', '2026-05-03': '憲法記念日', '2026-05-04': 'みどりの日',
    '2026-05-05': 'こどもの日', '2026-05-06': '振替休日', '2026-07-20': '海の日', '2026-08-11': '山の日',
    '2026-09-21': '敬老の日', '2026-09-22': '国民の休日', '2026-09-23': '秋分の日', '2026-10-12': 'スポーツの日',
    '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日',
    '2027-01-01': '元日', '2027-01-11': '成人の日', '2027-02-11': '建国記念の日', '2027-02-23': '天皇誕生日',
    '2027-03-21': '春分の日', '2027-03-22': '振替休日', '2027-04-29': '昭和の日', '2027-05-03': '憲法記念日',
    '2027-05-04': 'みどりの日', '2027-05-05': 'こどもの日', '2027-07-19': '海の日', '2027-08-11': '山の日',
    '2027-09-20': '敬老の日', '2027-09-23': '秋分の日', '2027-10-11': 'スポーツの日', '2027-11-03': '文化の日',
    '2027-11-23': '勤労感謝の日'
  };
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];
  const KEY = 'visit-calendar-v1';

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const uid = () => Math.random().toString(36).slice(2, 9);

  function nextMonth() {
    const t = new Date();
    t.setDate(1); t.setMonth(t.getMonth() + 1);
    return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`;
  }

  function sampleState() {
    const ym = nextMonth();
    const [y, m] = ym.split('-').map(Number);
    const visits = [];
    const days = new Date(y, m, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const w = new Date(y, m - 1, d).getDay();
      if (w === 2 || w === 5) visits.push({ id: uid(), date: ymd(y, m, d), start: '10:00', end: '11:00', label: '訪問看護（佐藤）' });
      if (w === 3 && d <= 21) visits.push({ id: uid(), date: ymd(y, m, d), start: '14:00', end: '14:40', label: 'リハビリ（高橋）' });
    }
    return {
      sample: true,
      client: '山田 花子', kind: '訪問予定表', ym,
      office: '訪問看護ステーションさくら', phone: '03-1234-5678', staff: '佐藤',
      note: 'ご都合が悪くなった場合は、前日までにご連絡ください。\n体調に変化があった時は、時間に関わらずお電話ください。',
      visits
    };
  }

  let state;
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : sampleState();
    if (!state || !Array.isArray(state.visits)) state = sampleState();
  } catch (e) { state = sampleState(); }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 保存できない環境でも動作は続ける */ }
  }

  // ---------- フォーム ----------
  const textFields = ['client', 'ym', 'kind', 'office', 'phone', 'staff', 'note'];
  textFields.forEach((k) => {
    const el = $(k);
    el.value = state[k] || '';
    el.addEventListener('input', () => { state[k] = el.value; state.sample = false; save(); render(); });
  });

  $('add-recurring').addEventListener('click', () => {
    const days = [...document.querySelectorAll('#weekdays input:checked')].map((i) => Number(i.value));
    if (!state.ym) { alert('先に年月を選んでください。'); return; }
    if (!days.length) { alert('曜日を1つ以上選んでください。'); return; }
    const [y, m] = state.ym.split('-').map(Number);
    const last = new Date(y, m, 0).getDate();
    const start = $('r-start').value, end = $('r-end').value, label = $('r-label').value.trim();
    for (let d = 1; d <= last; d++) {
      if (days.includes(new Date(y, m - 1, d).getDay())) {
        state.visits.push({ id: uid(), date: ymd(y, m, d), start, end, label });
      }
    }
    state.sample = false; save(); render();
  });

  $('add-single').addEventListener('click', () => {
    const date = $('s-date').value;
    if (!date) { alert('日付を選んでください。'); return; }
    state.visits.push({ id: uid(), date, start: $('s-start').value, end: $('s-end').value, label: $('s-label').value.trim() });
    if (date.slice(0, 7) !== state.ym) { state.ym = date.slice(0, 7); $('ym').value = state.ym; }
    state.sample = false; save(); render();
  });

  $('clear-month').addEventListener('click', () => {
    const n = monthVisits().length;
    if (!n) return;
    if (!confirm(`${state.ym} の訪問 ${n} 件をすべて消します。よろしいですか？`)) return;
    state.visits = state.visits.filter((v) => v.date.slice(0, 7) !== state.ym);
    state.sample = false; save(); render();
  });

  $('print').addEventListener('click', () => window.print());

  // ---------- 一覧 ----------
  function monthVisits() {
    return state.visits
      .filter((v) => v.date && v.date.slice(0, 7) === state.ym)
      .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  }

  function renderList() {
    const list = $('visits');
    const rows = monthVisits();
    $('count').textContent = rows.length ? `${rows.length} 件` : '';
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<p class="visits-empty">この月の訪問はまだありません。上から追加してください。</p>';
      return;
    }
    rows.forEach((v) => {
      const row = document.createElement('div');
      row.className = 'visit';
      row.innerHTML = `
        <input type="date" value="${v.date}" aria-label="日付" data-k="date">
        <input type="time" value="${v.start || ''}" aria-label="開始" data-k="start">
        <input type="time" value="${v.end || ''}" aria-label="終了" data-k="end">
        <input type="text" value="" aria-label="内容" data-k="label">
        <button class="del" type="button" aria-label="この訪問を消す">✕</button>`;
      row.querySelector('[data-k="label"]').value = v.label || '';
      row.querySelectorAll('input').forEach((inp) => {
        inp.addEventListener('change', () => { v[inp.dataset.k] = inp.value; state.sample = false; save(); render(); });
      });
      row.querySelector('.del').addEventListener('click', () => {
        state.visits = state.visits.filter((x) => x.id !== v.id); state.sample = false; save(); render();
      });
      list.appendChild(row);
    });
  }

  // ---------- 用紙 ----------
  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function renderSheet() {
    const sheet = $('sheet');
    if (!state.ym) { sheet.innerHTML = ''; return; }
    const [y, m] = state.ym.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const last = new Date(y, m, 0).getDate();
    const lead = first.getDay();
    const rows = Math.ceil((lead + last) / 7);
    const todayKey = (() => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()); })();

    const byDate = {};
    monthVisits().forEach((v) => { (byDate[v.date] ||= []).push(v); });

    let cells = '';
    for (let i = 0; i < rows * 7; i++) {
      const d = i - lead + 1;
      if (d < 1 || d > last) { cells += '<div class="cell out"></div>'; continue; }
      const key = ymd(y, m, d);
      const w = i % 7;
      const hol = HOLIDAYS[key];
      const cls = ['cell', w === 0 ? 'sun' : '', w === 6 ? 'sat' : '', hol ? 'holiday' : '', key === todayKey ? 'today' : ''].filter(Boolean).join(' ');
      const entries = (byDate[key] || []).map((v) => {
        const time = v.start && v.end ? `${v.start}〜${v.end}` : (v.start || v.end || '');
        const compact = rows === 6 || (byDate[key].length > 2);
        return `<div class="entry${compact ? ' compact' : ''}"><span class="time">${esc(time)}</span><span class="label">${esc(v.label)}</span></div>`;
      }).join('');
      cells += `<div class="${cls}"><div class="daynum"><b>${d}</b>${hol ? `<span class="hname">${esc(hol)}</span>` : ''}</div>${entries}</div>`;
    }

    const officeLines = [
      state.office ? `<strong>${esc(state.office)}</strong>` : '',
      [state.phone ? `TEL ${esc(state.phone)}` : '', state.staff ? `担当：${esc(state.staff)}` : ''].filter(Boolean).join('　')
    ].filter(Boolean).join('<br>');

    sheet.innerHTML = `
      <div class="sheet-head">
        <div>
          <div class="sheet-title">
            <span class="ym">${y}<small>年</small> ${m}<small>月</small></span>
            <span class="kind">${esc(state.kind || '訪問予定表')}</span>
          </div>
          <div class="sheet-client">${esc(state.client || '　')}<span class="sama">様</span></div>
        </div>
        <div class="sheet-office">${officeLines}</div>
      </div>
      <div class="dow">${DOW.map((d, i) => `<div class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('')}</div>
      <div class="grid" style="grid-template-rows: repeat(${rows}, 1fr)">${cells}</div>
      <div class="sheet-foot">
        <div class="note">${esc(state.note)}</div>
        <div class="legend"><i></i>訪問の時間　<span style="color:var(--sun)">■</span>日曜・祝日　<span style="color:var(--sat)">■</span>土曜</div>
      </div>`;
  }

  function fit() {
    const frame = $('frame');
    const w = frame.clientWidth;
    const sheetW = $('sheet').getBoundingClientRect().width / (currentScale || 1);
    const s = Math.min(1, w / sheetW);
    currentScale = s;
    $('scale').style.transform = `scale(${s})`;
    frame.style.height = `${$('sheet').offsetHeight * s}px`;
  }
  let currentScale = 1;

  function render() {
    renderList();
    renderSheet();
    $('sample-hint').innerHTML = state.sample ? '<span class="sample-tag">サンプル</span> 左の内容を書き換えるとあなたの予定表になります' : '';
    fit();
  }

  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // ---------- 画像書き出し ----------
  $('export').addEventListener('click', async () => {
    const btn = $('export');
    if (typeof html2canvas !== 'function') { alert('画像化の部品が読み込めませんでした。代わりに「印刷 / PDF に保存」をお使いください。'); return; }
    btn.disabled = true; btn.textContent = '作成中…';
    const scaleEl = $('scale');
    const prev = scaleEl.style.transform;
    scaleEl.style.transform = 'none';
    try {
      const canvas = await html2canvas($('sheet'), { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      $('modal-img').src = canvas.toDataURL('image/png');
      $('modal').hidden = false;
    } catch (e) {
      alert('画像を作れませんでした。代わりに「印刷 / PDF に保存」をお使いください。');
    } finally {
      scaleEl.style.transform = prev;
      btn.disabled = false; btn.textContent = '画像にする（Canva 用）';
    }
  });
  $('modal-close').addEventListener('click', () => { $('modal').hidden = true; });
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').hidden = true; });

  render();
})();
</script>
